name: fymoney
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get: ^4.7.2
  bloc: ^9.0.0
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.7
  get_it: ^8.0.2
  shimmer: ^3.0.0
  freezed: ^3.2.0
  hive_ce: ^2.11.3
  injectable: ^2.5.0
  share_plus: ^11.0.0
  flutter_bloc: ^9.1.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.16
  after_layout: ^1.2.0
  flutter_udid: ^4.0.0
  google_sign_in: ^6.2.2 
  auto_size_text: ^3.0.0
  hive_ce_flutter: ^2.3.1
  json_annotation: ^4.9.0
  email_validator: ^3.0.0
  overlay_support: ^2.1.0
  package_info_plus: ^8.3.0
  device_info_plus: ^11.2.1
  connectivity_plus: ^6.0.3
  freezed_annotation: ^3.1.0
  flutter_screenutil: ^5.9.3
  syncfusion_localizations: ^31.2.10

  firebase_auth: any
  firebase_core: any
  cloud_firestore: any
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.6
  flutter_lints: ^5.0.0
  hive_ce_generator: ^1.9.3
  json_serializable: ^6.7.1
  injectable_generator: ^2.1.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/raster/
    - assets/images/vector/

  fonts:
    - family: SegoeUI
      fonts:
        - asset: assets/fonts/SegoeUI.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
  
